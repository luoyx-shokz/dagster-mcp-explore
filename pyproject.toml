[project]
name = "dagster-mcp"
version = "0.4.2.post1"
description = "Patched local Dagster MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
dagster-mcp = "dagster_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dagster_mcp"]
